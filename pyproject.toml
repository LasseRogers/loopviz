[project]
name = "loopviz"
version = "0.1.0"
description = "Loopback audio visualizer"
readme = "README.md"
authors = [
    { name = "Lasse Rogers Nielsen", email = "lasr@kb.dk" }
]
requires-python = ">=3.12"
dependencies = [
    "moderngl>=5.13.0",
    "numpy>=2.5.5",
    "pygame-ce>=2.5.8",
    "soundcard>=0.4.6",
]

[project.scripts]
loopviz = "loopviz:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
